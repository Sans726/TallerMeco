server.address=${APP_BIND:127.0.0.1}
server.port=${APP_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
spring.datasource.url=jdbc:mariadb://127.0.0.1:${DB_PORT:3306}/tallermeco
spring.datasource.username=taller_app
spring.datasource.password=${DB_APP_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=taller_owner
spring.flyway.password=${DB_OWNER_PASSWORD}
spring.flyway.baseline-on-migrate=false
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.mode=${MAIL_MODE:local}
app.mail.from=${MAIL_FROM:no-reply@tallermeco.local}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.outbox=${MAIL_OUTBOX:../.local/mail}
app.bootstrap.password=${ADMIN_INITIAL_PASSWORD:}

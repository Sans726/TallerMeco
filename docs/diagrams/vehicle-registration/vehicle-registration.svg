<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">TallerMeco — Registro y administración de vehículos</title><desc id="desc">Diagrama vigente V7. Las tablas del documento explican cada elemento y sus reglas.</desc><rect width="100%" height="100%" fill="#f6f8fa"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#526b61"/></marker></defs><text x="30" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#18372c">TallerMeco · Registro y administración de vehículos</text><text x="30" y="70" font-family="Arial,sans-serif" font-size="14" fill="#526b61">Código vigente · Flyway V7 · 8 de octubre de 2026</text><path d="M355 174H380" stroke="#526b61" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="110" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="46" y="137" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">1. Taller y cliente</text><text x="46" y="163" font-family="Arial,sans-serif" font-size="13" fill="#31463d">Selector paginado de clientes</text><text x="46" y="195" font-family="Arial,sans-serif" font-size="12" fill="#526b61">CLIENT registra únicamente para su propia</text><text x="46" y="212" font-family="Arial,sans-serif" font-size="12" fill="#526b61">ficha.</text><path d="M720 174H745" stroke="#526b61" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="395" y="110" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="411" y="137" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">2. Precondición</text><text x="411" y="163" font-family="Arial,sans-serif" font-size="13" fill="#31463d">Cliente con allows_operations=true</text><text x="411" y="195" font-family="Arial,sans-serif" font-size="12" fill="#526b61">Asociación activa al taller; backend</text><text x="411" y="212" font-family="Arial,sans-serif" font-size="12" fill="#526b61">bloquea y valida.</text><rect x="760" y="110" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="776" y="137" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">3. Datos automotrices</text><text x="776" y="163" font-family="Arial,sans-serif" font-size="13" fill="#31463d">VIN 17; placa; marca/modelo/versión</text><text x="776" y="195" font-family="Arial,sans-serif" font-size="12" fill="#526b61">Año 1900–siguiente; color; kilometraje</text><text x="776" y="212" font-family="Arial,sans-serif" font-size="12" fill="#526b61">entero opcional.</text><path d="M355 364H380" stroke="#526b61" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="300" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="46" y="327" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">4. Canonicalización</text><text x="46" y="353" font-family="Arial,sans-serif" font-size="13" fill="#31463d">VIN y placa mayúsculas</text><text x="46" y="385" font-family="Arial,sans-serif" font-size="12" fill="#526b61">Datos comerciales normalizados;</text><text x="46" y="402" font-family="Arial,sans-serif" font-size="12" fill="#526b61">captura/pegado validado.</text><path d="M720 364H745" stroke="#526b61" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="395" y="300" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="411" y="327" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">5. Persistencia</text><text x="411" y="353" font-family="Arial,sans-serif" font-size="13" fill="#31463d">JDBC + VIN único + FK status_id</text><text x="411" y="385" font-family="Arial,sans-serif" font-size="12" fill="#526b61">409 duplicado/version; auditoría en</text><text x="411" y="402" font-family="Arial,sans-serif" font-size="12" fill="#526b61">transacción.</text><rect x="760" y="300" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="776" y="327" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">6. Directorio y modal</text><text x="776" y="353" font-family="Arial,sans-serif" font-size="13" fill="#31463d">Máximo 10; ASC/DESC; búsqueda/status</text><text x="776" y="385" font-family="Arial,sans-serif" font-size="12" fill="#526b61">Ficha, edición y transición; en servicio</text><text x="776" y="402" font-family="Arial,sans-serif" font-size="12" fill="#526b61">derivado.</text><path d="M922 238V272H192V300" stroke="#526b61" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="483" font-family="Arial,sans-serif" font-size="13" fill="#526b61">Fuente: código, contratos y migraciones del repositorio. Reglas detalladas en las tablas HTML/Markdown.</text></svg>
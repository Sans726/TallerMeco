<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">TallerMeco — Catálogos y transiciones de estatus</title><desc id="desc">Diagrama vigente V7. Las tablas del documento explican cada elemento y sus reglas.</desc><rect width="100%" height="100%" fill="#f6f8fa"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#526b61"/></marker></defs><text x="30" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#18372c">TallerMeco · Catálogos y transiciones de estatus</text><text x="30" y="70" font-family="Arial,sans-serif" font-size="14" fill="#526b61">Código vigente · Flyway V7 · 8 de octubre de 2026</text><path d="M355 174H380" stroke="#526b61" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="110" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="46" y="137" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">1. Catálogo separado</text><text x="46" y="163" font-family="Arial,sans-serif" font-size="13" fill="#31463d">customer_status / vehicle_status</text><text x="46" y="195" font-family="Arial,sans-serif" font-size="12" fill="#526b61">ACTIVE y SUSPENDED sembrados; FK por</text><text x="46" y="212" font-family="Arial,sans-serif" font-size="12" fill="#526b61">entidad.</text><path d="M720 174H745" stroke="#526b61" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="395" y="110" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="411" y="137" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">2. Administración</text><text x="411" y="163" font-family="Arial,sans-serif" font-size="13" fill="#31463d">Solo ADMIN</text><text x="411" y="195" font-family="Arial,sans-serif" font-size="12" fill="#526b61">Custom: crear/editar/borrar sin uso.</text><text x="411" y="212" font-family="Arial,sans-serif" font-size="12" fill="#526b61">Recepción consulta.</text><rect x="760" y="110" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="776" y="137" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">3. Protección</text><text x="776" y="163" font-family="Arial,sans-serif" font-size="13" fill="#31463d">system + allows_operations</text><text x="776" y="195" font-family="Arial,sans-serif" font-size="12" fill="#526b61">Code y semántica protegidos por servicio y</text><text x="776" y="212" font-family="Arial,sans-serif" font-size="12" fill="#526b61">triggers.</text><path d="M355 364H380" stroke="#526b61" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="300" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="46" y="327" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">4. Transición</text><text x="46" y="353" font-family="Arial,sans-serif" font-size="13" fill="#31463d">Scope + bloqueo + version</text><text x="46" y="385" font-family="Arial,sans-serif" font-size="12" fill="#526b61">Cliente/vehículo pertenece al taller</text><text x="46" y="402" font-family="Arial,sans-serif" font-size="12" fill="#526b61">autorizado.</text><path d="M720 364H745" stroke="#526b61" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="395" y="300" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="411" y="327" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">5. Sin cambio</text><text x="411" y="353" font-family="Arial,sans-serif" font-size="13" fill="#31463d">status_id igual al actual</text><text x="411" y="385" font-family="Arial,sans-serif" font-size="12" fill="#526b61">No incrementa versión ni duplica eventos.</text><rect x="760" y="300" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="776" y="327" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">6. Auditoría</text><text x="776" y="353" font-family="Arial,sans-serif" font-size="13" fill="#31463d">Anterior + nuevo + actor + taller</text><text x="776" y="385" font-family="Arial,sans-serif" font-size="12" fill="#526b61">CUSTOMER_STATUS_CHANGED /</text><text x="776" y="402" font-family="Arial,sans-serif" font-size="12" fill="#526b61">VEHICLE_STATUS_CHANGED.</text><path d="M922 238V272H192V300" stroke="#526b61" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="483" font-family="Arial,sans-serif" font-size="13" fill="#526b61">Fuente: código, contratos y migraciones del repositorio. Reglas detalladas en las tablas HTML/Markdown.</text></svg>
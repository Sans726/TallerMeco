<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">TallerMeco — Modelo de datos V7</title><desc id="desc">Diagrama vigente V7. Las tablas del documento explican cada elemento y sus reglas.</desc><rect width="100%" height="100%" fill="#f6f8fa"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#526b61"/></marker></defs><text x="30" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#18372c">TallerMeco · Modelo de datos V7</text><text x="30" y="70" font-family="Arial,sans-serif" font-size="14" fill="#526b61">Código vigente · Flyway V7 · 8 de octubre de 2026</text><rect x="30" y="110" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="46" y="137" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">1. company → workshop</text><text x="46" y="163" font-family="Arial,sans-serif" font-size="13" fill="#31463d">1:N</text><text x="46" y="195" font-family="Arial,sans-serif" font-size="12" fill="#526b61">Empresa y talleres activos; razón social,</text><text x="46" y="212" font-family="Arial,sans-serif" font-size="12" fill="#526b61">RFC y banner.</text><rect x="395" y="110" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="411" y="137" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">2. app_user → user_workshop</text><text x="411" y="163" font-family="Arial,sans-serif" font-size="13" fill="#31463d">1:N</text><text x="411" y="195" font-family="Arial,sans-serif" font-size="12" fill="#526b61">Asignación explícita de alcance a</text><text x="411" y="212" font-family="Arial,sans-serif" font-size="12" fill="#526b61">recepción.</text><rect x="760" y="110" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="776" y="137" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">3. workshop → user_workshop</text><text x="776" y="163" font-family="Arial,sans-serif" font-size="13" fill="#31463d">1:N</text><text x="776" y="195" font-family="Arial,sans-serif" font-size="12" fill="#526b61">PK compuesta: user_id + workshop_id;</text><text x="776" y="212" font-family="Arial,sans-serif" font-size="12" fill="#526b61">active.</text><rect x="30" y="300" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="46" y="327" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">4. customer ↔ workshop</text><text x="46" y="353" font-family="Arial,sans-serif" font-size="13" fill="#31463d">N:M por customer_workshop</text><text x="46" y="385" font-family="Arial,sans-serif" font-size="12" fill="#526b61">PK compuesta, estado del vínculo e</text><text x="46" y="402" font-family="Arial,sans-serif" font-size="12" fill="#526b61">integridad FK.</text><rect x="395" y="300" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="411" y="327" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">5. customer → customer_contact</text><text x="411" y="353" font-family="Arial,sans-serif" font-size="13" fill="#31463d">1:N</text><text x="411" y="385" font-family="Arial,sans-serif" font-size="12" fill="#526b61">PK kind + value evita contactos compartidos</text><text x="411" y="402" font-family="Arial,sans-serif" font-size="12" fill="#526b61">entre clientes.</text><rect x="760" y="300" width="325" height="128" rx="10" fill="white" stroke="#9bad9e"/><text x="776" y="327" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#18372c">6. customer → vehicle</text><text x="776" y="353" font-family="Arial,sans-serif" font-size="13" fill="#31463d">1:N; acceso vía customer_workshop</text><text x="776" y="385" font-family="Arial,sans-serif" font-size="12" fill="#526b61">VIN único; color, km, versión; órdenes</text><text x="776" y="402" font-family="Arial,sans-serif" font-size="12" fill="#526b61">derivan en servicio.</text><text x="30" y="483" font-family="Arial,sans-serif" font-size="13" fill="#526b61">Fuente: código, contratos y migraciones del repositorio. Reglas detalladas en las tablas HTML/Markdown.</text></svg>